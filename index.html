<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Runner Pro</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-green: #00ff66;
            --bg-color: #0d0d1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Задний фон с динамическими узорами */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-color: #ffd700; /* Стартовые желтые обои по ТЗ */
            opacity: 1;
            transition: all 0.5s ease;
        }
        
        .bg-pattern.pattern-dots {
            background: var(--bg-color) radial-gradient(var(--neon-magenta) 10%, transparent 11%);
            background-size: 30px 30px;
        }
        .bg-pattern.pattern-lines {
            background: var(--bg-color) linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%);
            background-size: 40px 40px;
        }
        .bg-pattern.pattern-grid {
            background: var(--bg-color) linear-gradient(to right, #222 1px, transparent 1px), linear-gradient(to bottom, #222 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-pattern.pattern-evo {
            background: #4a00e0;
            background-image: linear-gradient(135deg, #8e2de2 25%, transparent 25%), linear-gradient(225deg, #8e2de2 25%, transparent 25%);
            background-size: 50px 50px;
        }

        .window {
            width: 800px;
            height: 600px;
            background: rgba(13, 13, 26, 0.95);
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }

        h1 {
            color: #fff;
            font-size: 42px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        .balance-text {
            color: var(--neon-magenta);
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* Кнопки меню */
        .menu-btn {
            width: 320px;
            padding: 12px;
            margin: 10px 0;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.2);
            text-align: center;
        }

        .menu-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Магазины и списки предметов */
        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            cursor: pointer;
        }
        .tab-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .items-grid {
            width: 90%;
            height: 320px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 10px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.5);
        }

        .shop-item {
            border: 2px solid #444;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #151525;
        }
        .shop-item.active-equip {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .item-preview {
            width: 45px;
            height: 45px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
        }

        .buy-btn {
            width: 100%;
            padding: 6px;
            background: #222;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        .buy-btn.owned { background: #113311; border-color: green; }

        /* Игровой холст */
        canvas {
            background: #000;
            border: 2px solid #fff;
            display: block;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 95%;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .back-btn {
            margin-top: 15px;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta);
            cursor: pointer;
        }
        .back-btn:hover {
            background: var(--neon-magenta);
            color: #fff;
        }

        /* Настройки */
        .setting-row {
            margin: 15px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .toggle-btn {
            padding: 6px 12px;
            cursor: pointer;
            background: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .toggle-btn.on { background: var(--neon-green); color: #000; }
    </style>
</head>
<body>

    <div class="bg-pattern" id="mainBgPattern"></div>

    <div class="window">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menuScreen" class="screen active">
            <h1 id="menuTitle">CYBER RUNNER EVO</h1>
            <div class="balance-text">Баланс: <span class="coins-val">0</span> 🪙 | Рекорд: <span id="recordVal">0</span></div>
            
            <button class="menu-btn" onclick="changeScreen('gameScreen'); startGame();">Старт забега</button>
            <button class="menu-btn" onclick="changeScreen('shopScreen'); loadShop('skins');">🛍️ Магазин</button>
            <button class="menu-btn" onclick="changeScreen('musicScreen');">🎵 Магазин музыки</button>
            <button class="menu-btn" onclick="changeScreen('settingsScreen');">⚙️ Настройки</button>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="gameScreen" class="screen">
            <div class="game-info">
                <div>Счет: <span id="scoreVal">0</span></div>
                <div>Баланс: <span class="coins-val">0</span> 🪙</div>
                <div>Скорость: <span id="speedIndicator">1.0</span>x</div>
            </div>
            <canvas id="gameCanvas" width="750" height="400"></canvas>
            <button class="back-btn" onclick="exitGame()">Выйти в меню</button>
        </div>

        <!-- МАГАЗИН СКИНОВ И ФОНОВ -->
        <div id="shopScreen" class="screen">
            <h2>Обычный Магазин</h2>
            <div class="shop-tabs">
                <button class="tab-btn active" id="tabSkins" onclick="loadShop('skins')">Раздел 1: Цвета куба</button>
                <button class="tab-btn" id="tabBackgrounds" onclick="loadShop('backgrounds')">Раздел 2: Фоны</button>
                <button class="tab-btn" id="tabObstacles" onclick="loadShop('obstacles')">Раздел 3: Любые цвета</button>
            </div>
            <div class="items-grid" id="shopGrid"></div>
            <button class="back-btn" onclick="changeScreen('menuScreen')">Назад</button>
        </div>

        <!-- МАГАЗИН МУЗЫКИ -->
        <div id="musicScreen" class="screen">
            <h2>Магазин Музыки</h2>
            <div style="margin-bottom:15px; color:#aaa;">Смотрите рекламу, чтобы разблокировать треки!</div>
            <div class="items-grid" id="musicGrid"></div>
            <button class="back-btn" onclick="changeScreen('menuScreen')">Назад</button>
        </div>

        <!-- ЭКРАН НАСТРОЕК -->
        <div id="settingsScreen" class="screen">
            <h2>Настройки игры</h2>
            
            <div class="setting-row">
                <span>Автоматический режим (Смена темы на 100k+):</span>
                <button class="toggle-btn on" id="autoModeBtn" onclick="toggleAutoMode()">ВКЛ</button>
            </div>
            
            <div class="setting-row">
                <span>Звук в игре:</span>
                <button class="toggle-btn on" id="soundBtn" onclick="toggleSound()">ВКЛ</button>
            </div>

            <div class="setting-row" style="flex-direction:column; align-items:flex-start;">
                <div>Изменение скорости игры (за 5 реклам):</div>
