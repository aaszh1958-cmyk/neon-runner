<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Neon Runner Ultimate Edition</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-green: #00ff66;
            --bg-color: #0d0d1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Задний фон с динамическими узорами из ТЗ */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-color: #ffd700; /* Начальные желтые обои по ТЗ */
            transition: all 0.5s ease;
        }
        
        .bg-pattern.pattern-dots {
            background: var(--bg-color) radial-gradient(var(--neon-magenta) 10%, transparent 11%);
            background-size: 30px 30px;
        }
        .bg-pattern.pattern-lines {
            background: var(--bg-color) linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%);
            background-size: 40px 40px;
        }
        .bg-pattern.pattern-grid {
            background: var(--bg-color) linear-gradient(to right, #222 1px, transparent 1px), linear-gradient(to bottom, #222 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-pattern.pattern-evo {
            background: #4a00e0;
            background-image: linear-gradient(135deg, #8e2de2 25%, transparent 25%), linear-gradient(225deg, #8e2de2 25%, transparent 25%);
            background-size: 50px 50px;
        }

        /* Главное окно игры */
        .window {
            width: 95vw;
            max-width: 800px;
            height: 90vh;
            max-height: 600px;
            background: rgba(13, 13, 26, 0.96);
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-size: 38px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--neon-magenta);
            text-align: center;
        }

        .balance-text {
            color: var(--neon-magenta);
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
        }

        /* Системные экраны */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex !important;
        }

        /* Кнопки управления */
        .menu-btn {
            width: 290px;
            padding: 14px;
            margin: 8px 0;
            background: #111;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.2s ease;
            text-align: center;
            outline: none;
        }

        .menu-btn:hover, .menu-btn:active {
            background: var(--neon-cyan) !important;
            color: #000 !important;
            box-shadow: 0 0 18px var(--neon-cyan) !important;
        }

        /* Вкладки разделов магазина */
        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 14px;
            background: #1a1a2e;
            border: 2px solid #333;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* Контейнер для вывода товаров */
        .items-grid {
            width: 100%;
            height: 300px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding: 10px;
            border: 2px solid #222;
            background: rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            border-radius: 5px;
        }

        /* Карточка товара */
        .shop-item {
            border: 2px solid #444;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #16162d;
            font-size: 13px;
            box-sizing: border-box;
        }

        .shop-item.active-equip {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 12px var(--neon-green);
        }

        .item-preview {
            width: 45px;
            height: 45px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .buy-btn {
            width: 100%;
            padding: 8px;
            background: #252545;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #353565; }
        .buy-btn.owned { background: #114411; border-color: #00ff00; }
        .buy-btn.owned:hover { background: #155515; }

        /* Холст игры */
        canvas {
            background: #000;
            border: 2px solid #fff;
            max-width: 100%;
            height: auto;
            aspect-ratio: 75/40;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        .back-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: #111;
            border: 2px solid var(--neon-magenta);
            color: var(--neon-magenta);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
        }
        .back-btn:hover {
            background: var(--neon-magenta);
            color: #fff;
            box-shadow: 0 0 12px var(--neon-magenta);
        }

        .setting-row {
            margin: 12px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            justify-content: space-between;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <!-- Обои заднего плана -->
    <div class="bg-pattern" id="mainBgPattern"></div>

    <div class="window">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menuScreen" class="screen active">
            <h1>CYBER RUNNER EVO</h1>
            <div class="balance-text">Баланс: <span class="coins-val">0</span> 🪙 | Рекорд: <span id="recordVal">0</span></div>
            
            <button class="menu-btn" id="btn-start">Старт забега</button>
            <button class="menu-btn" id="btn-shop">🛍️ Магазин скинов</button>
            <button class="menu-btn" id="btn-music">🎵 Магазин музыки</button>
            <button class="menu-btn" id="btn-settings">⚙️ Настройки</button>
        </div>

        <!-- ИГРОВОЙ ПРОЦЕСС -->
        <div id="gameScreen" class="screen">
            <div class="game-info">
                <div>Счет: <span id="scoreVal">0</span></div>
                <div>Монеты: <span class="coins-val">0</span> 🪙</div>
                <div>Скорость: <span id="speedIndicator">1.0</span>x</div>
            </div>
            <canvas id="gameCanvas" width="750" height="400"></canvas>
            <button class="back-btn" id="btn-exit-game">Выйти в меню</button>
        </div>

        <!-- КАТАЛОГ ОБЫЧНОГО МАГАЗИНА -->
        <div id="shopScreen" class="screen">
            <h2>Обычный Магазин</h2>
            <div class="shop-tabs">
                <button class="tab-btn active" id="tabSkins">Раздел 1: Цвета куба</button>
                <button class="tab-btn" id="tabBackgrounds">Раздел 2: Фоны</button>
                <button class="tab-btn" id="tabObstacles">Раздел 3: Любые цвета</button>
            </div>
            <div class="items-grid" id="shopGrid">
