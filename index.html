<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Runner Evo</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-green: #00ff66;
            --bg-color: #0d0d1a;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background-color: #ffd700;
            transition: all 0.5s ease;
        }
        .bg-pattern.pattern-evo {
            background: #4a00e0;
            background-image: linear-gradient(135deg, #8e2de2 25%, transparent 25%), linear-gradient(225deg, #8e2de2 25%, transparent 25%);
            background-size: 50px 50px;
        }
        .window {
            width: 95vw; max-width: 800px; height: 90vh; max-height: 600px;
            background: rgba(13, 13, 26, 0.95);
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-radius: 10px;
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-sizing: border-box; padding: 20px; z-index: 10;
        }
        h1 {
            color: #fff; font-size: 32px; margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-magenta); text-align: center;
        }
        .balance-text { color: var(--neon-magenta); font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex !important; }
        .menu-btn {
            width: 280px; padding: 14px; margin: 8px 0;
            background: #111; border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); font-size: 16px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; border-radius: 5px;
            transition: all 0.2s ease; text-align: center; outline: none;
        }
        .menu-btn:hover, .menu-btn:active {
            background: var(--neon-cyan) !important; color: #000 !important;
            box-shadow: 0 0 15px var(--neon-cyan) !important;
        }
        .shop-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 12px; background: #222; border: 1px solid #444; color: #fff; cursor: pointer; }
        .tab-btn.active { border-color: var(--neon-green); color: var(--neon-green); }
        .items-grid {
            width: 100%; height: 280px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px; padding: 10px; border: 1px solid #333; background: rgba(0,0,0,0.5); box-sizing: border-box;
        }
        .shop-item {
            border: 2px solid #444; padding: 10px; border-radius: 5px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            background: #151525; font-size: 12px;
        }
        .buy-btn { width: 100%; padding: 6px; background: #222; border: 1px solid #666; color: #fff; cursor: pointer; }
        canvas { background: #000; border: 2px solid #fff; max-width: 100%; height: auto; aspect-ratio: 75/40; }
        .game-info { display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px; }
        .back-btn { margin-top: 15px; padding: 8px 20px; background: #222; border: 1px solid var(--neon-magenta); color: var(--neon-magenta); cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-pattern" id="mainBgPattern"></div>

    <div class="window">
        <div id="menuScreen" class="screen active">
            <h1>CYBER RUNNER EVO</h1>
            <div class="balance-text">Баланс: <span class="coins-val">0</span> 🪙 | Рекорд: <span id="recordVal">0</span></div>
            
            <button class="menu-btn" id="btn-start">Старт забега</button>
            <button class="menu-btn" id="btn-shop">🛍️ Магазин</button>
            <button class="menu-btn" id="btn-music">🎵 Магазин музыки</button>
            <button class="menu-btn" id="btn-settings">⚙️ Настройки</button>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-info">
                <div>Счет: <span id="scoreVal">0</span></div>
                <div>Баланс: <span class="coins-val">0</span> 🪙</div>
                <div>Скорость: <span id="speedIndicator">1.0</span>x</div>
            </div>
            <canvas id="gameCanvas" width="750" height="400"></canvas>
            <button class="back-btn" id="btn-exit-game">Выйти в меню</button>
        </div>

        <div id="shopScreen" class="screen">
            <h2>Магазин</h2>
            <div class="shop-tabs">
                <button class="tab-btn active" id="tabSkins">Цвета</button>
                <button class="tab-btn" id="tabBackgrounds">Фоны</button>
                <button class="tab-btn" id="tabObstacles">Лазеры</button>
            </div>
            <div class="items-grid" id="shopGrid"></div>
            <button class="back-btn" id="btn-back-shop">Назад</button>
        </div>

        <div id="musicScreen" class="screen">
            <h2>Магазин Музыки</h2>
            <div class="items-grid" id="musicGrid"></div>
            <button class="back-btn" id="btn-back-music">Назад</button>
        </div>

        <div id="settingsScreen" class="screen">
            <h2>Настройки</h2>
            <button class="back-btn" id="btn-back-settings">Назад</button>
        </div>
    </div>

    <script>
        // Проверка запуска скрипта
        console.log("Скрипт игры успешно запущен!");

        let state = { coins: 0, highscore: 0, claimedThresholds: [], autoMode: true, sound: true, gameSpeedModifier: 1.0, ownedSkins: ['yellow'], activeSkin: 'yellow', ownedBackgrounds: ['default-yellow'], activeBackground: 'default-yellow', ownedObstacles: ['red-laser'], activeObstacle: 'red-laser', adCounts: { skins: {}, music: {} }, ownedMusic: [], activeMusic: null };

        function changeScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Привязка событий напрямую через JS для гарантии работы кнопок
        document.getElementById('btn-start').onclick = () => { changeScreen('gameScreen'); alert('Забег начинается!'); };
        document.getElementById('btn-shop').onclick = () => { changeScreen('shopScreen'); };
        document.getElementById('btn-music').onclick = () => { changeScreen('musicScreen'); };
        document.getElementById('btn-settings').onclick = () => { changeScreen('settingsScreen'); };
        
        document.getElementById('btn-exit-game').onclick = () => changeScreen('menuScreen');
        document.getElementById('btn-back-shop').onclick = () => changeScreen('menuScreen');
        document.getElementById('btn-back-music').onclick = () => changeScreen('menuScreen');
        document.getElementById('btn-back-settings').onclick = () => changeScreen('menuScreen');
    </script>
</body>
</html>
